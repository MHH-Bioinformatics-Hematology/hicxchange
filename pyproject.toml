# hic2cool 2.x is a fork of hic2cool (https://github.com/4dn-dcic/hic2cool),
# written by Carl Vitzthum, Nezar Abdennur, Soo Lee and Peter Kerpedjiev and
# released under the MIT licence, which this fork keeps. The original .hic
# parsing was based on the straw project by Neva C. Durand and Yue Wu
# (https://github.com/theaidenlab/straw); the cooler file layout follows
# cooler (https://github.com/open2c/cooler). The conversions are now C++.

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "hic2cool"
version = "2.0.0"
description = "Converter between hic files (from juicer) and single-resolution or multi-resolution cool files (for cooler), both directions, .hic versions 6 to 9, multi-threaded C++."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Carl Vitzthum", email = "carl.vitzthum@gmail.com" },
    { name = "Joachim Wolff" },
]
keywords = ["bioinformatics", "genomics", "hi-c", "juicer", "cooler", "contact-matrix", "file-format"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = ["numpy>=1.9"]

[project.optional-dependencies]
test = ["pytest", "h5py", "cooler"]

[project.urls]
Repository = "https://github.com/4dn-dcic/hic2cool/"

[tool.scikit-build]
cmake.version = ">=3.21"
wheel.packages = ["hic2cool"]
build.targets = ["_hic2cool", "hic2cool", "cool2hic"]
install.components = []

[tool.scikit-build.cmake.define]
HIC2COOL_BUILD_PYTHON = "ON"
HIC2COOL_BUILD_TESTS = "OFF"
